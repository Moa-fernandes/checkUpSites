{% extends "base.html" %}

{% block title %}Erro {{ code }} — checkUp{% endblock %}

{% block content %}
  <div class="rounded-3xl border border-slate-200 bg-white px-6 py-16 text-center shadow-sm">
    <p class="font-mono text-sm font-bold uppercase tracking-wider text-indigo-700">Erro {{ code }}</p>
    <h1 class="mt-3 text-2xl font-extrabold tracking-tight text-slate-900 sm:text-3xl">{{ message }}</h1>
    <a href="/"
       class="mt-8 inline-flex min-h-[48px] items-center justify-center rounded-xl bg-indigo-700 px-6 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2">
      Voltar ao início
    </a>
  </div>
{% endblock %}
